services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: boxpulse
      POSTGRES_USER: boxpulse
      POSTGRES_PASSWORD: boxpulse
    ports:
      - "5432:5432"
    volumes:
      - boxpulse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boxpulse -d boxpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://boxpulse:boxpulse@db:5432/boxpulse
      BOXPULSE_VERBOSE_LOGS: "false"
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      BOXPULSE_VERBOSE_LOGS: "false"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  boxpulse_db_data:
