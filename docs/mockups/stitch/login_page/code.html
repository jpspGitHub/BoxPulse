<script>
        // Simple Interaction Script
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('border-primary-container');
                    input.parentElement.classList.remove('border-outline-variant');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('border-primary-container');
                    input.parentElement.classList.add('border-outline-variant');
                });
            });

            // Toggle Password Visibility
            const visibilityBtn = document.querySelector('button .material-symbols-outlined');
            if(visibilityBtn) {
                visibilityBtn.parentElement.addEventListener('click', () => {
                    const input = document.getElementById('password');
                    if (input.type === 'password') {
                        input.type = 'text';
                        visibilityBtn.innerText = 'visibility_off';
                    } else {
                        input.type = 'password';
                        visibilityBtn.innerText = 'visibility';
                    }
                });
            }
        });
    </script>
