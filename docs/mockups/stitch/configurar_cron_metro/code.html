<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar - Linear Transactional (Close Action) -->
<header class="flex justify-between items-center w-full px-container-margin h-16 border-b border-outline-variant bg-background z-50">
<button aria-label="Close" class="w-12 h-12 flex items-center justify-center text-primary transition-colors duration-200 hover:bg-surface-variant rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="text-headline-md font-headline-md text-primary tracking-wider uppercase">ROUNDLAB</h1>
<div class="w-12 h-12"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-container-margin py-lg gap-xl max-w-3xl mx-auto w-full pb-32">
<!-- Header Section -->
<section class="flex flex-col gap-sm">
<h2 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg-mobile md:font-headline-lg uppercase text-on-surface">Configurar cronómetro</h2>
<div class="inline-flex items-center gap-2 bg-surface-container py-2 px-4 rounded-full w-fit border border-outline-variant">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="text-label-md font-label-md text-on-surface-variant">Bolsa - 4 Boxeadores</span>
</div>
</section>
<!-- Config Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Round Length -->
<div class="bg-surface p-md rounded-lg border border-outline-variant flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase flex items-center gap-2">
<span class="material-symbols-outlined text-sm">schedule</span> Largo del round
                </label>
<div class="flex items-center justify-between bg-surface-container rounded-lg p-2">
<button aria-label="Decrease" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-primary active:border-primary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">remove</span>
</button>
<span class="text-headline-md font-headline-md tracking-wider">3:00</span>
<button aria-label="Increase" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-primary active:border-primary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
</div>
<!-- Rest Length -->
<div class="bg-surface p-md rounded-lg border border-outline-variant flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase flex items-center gap-2">
<span class="material-symbols-outlined text-sm">pause_circle</span> Descanso
                </label>
<div class="flex items-center justify-between bg-surface-container rounded-lg p-2">
<button aria-label="Decrease" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-secondary active:border-secondary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">remove</span>
</button>
<span class="text-headline-md font-headline-md tracking-wider">1:00</span>
<button aria-label="Increase" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-secondary active:border-secondary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
</div>
<!-- Rounds Count -->
<div class="bg-surface p-md rounded-lg border border-outline-variant flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase flex items-center gap-2">
<span class="material-symbols-outlined text-sm">repeat</span> Rounds
                </label>
<div class="flex items-center justify-between bg-surface-container rounded-lg p-2">
<button aria-label="Decrease" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-on-surface active:border-primary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">remove</span>
</button>
<span class="text-headline-md font-headline-md tracking-wider">5</span>
<button aria-label="Increase" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-on-surface active:border-primary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
</div>
<!-- Initial Prep -->
<div class="bg-surface p-md rounded-lg border border-outline-variant flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase flex items-center gap-2">
<span class="material-symbols-outlined text-sm">hourglass_empty</span> Prep inicial
                </label>
<div class="flex items-center justify-between bg-surface-container rounded-lg p-2">
<button aria-label="Decrease" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-tertiary active:border-tertiary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">remove</span>
</button>
<span class="text-headline-md font-headline-md tracking-wider">10s</span>
<button aria-label="Increase" class="w-12 h-12 bg-surface flex items-center justify-center rounded-md border border-outline-variant text-tertiary active:border-tertiary transition-colors">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
</div>
</div>
</section>
<!-- Summary & Final Action -->
<section class="mt-auto flex flex-col gap-md">
<div class="bg-surface-container-high border border-outline-variant rounded-lg p-md text-center">
<p class="text-body-lg font-body-lg text-on-surface-variant">
<span class="text-primary font-bold">5</span> rounds de <span class="text-primary font-bold">3:00</span>. Total: <span class="text-secondary font-bold text-xl">19:00</span>
</p>
</div>
<!-- Sticky Bottom Button for Mobile, regular for Desktop -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-background border-t border-outline-variant md:static md:bg-transparent md:border-none md:p-0 z-40">
<button class="w-full h-14 bg-primary-container text-on-primary-container flex items-center justify-center rounded-md font-headline-md text-headline-md uppercase tracking-wider hover:bg-primary transition-colors duration-200 shadow-[0px_4px_0px_rgba(0,0,0,0.5)] active:translate-y-1 active:shadow-none">
                    INICIAR CRONÓMETRO
                </button>
</div>
</section>
</main>
</body></html>
