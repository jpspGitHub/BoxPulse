                CONTINUAR
            </button>
</div>
</div>
<script>
        function toggleSelection(btn) {
            const isSelected = btn.classList.contains('selected');
            const allBtns = document.querySelectorAll('.group');
            
            // Deselect all
            allBtns.forEach(b => {
                b.classList.remove('selected', 'border-primary');
            });
            
            // Toggle current
            if (!isSelected) {
                btn.classList.add('selected', 'border-primary');
            }
            
            const continueBtn = document.getElementById('continue-btn');
            const anySelected = document.querySelectorAll('.selected').length > 0;
            
            if (anySelected) {
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                continueBtn.classList.add('bg-primary-container', 'text-on-primary', 'hover:bg-[#ff7a63]', 'cursor-pointer');
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.add('bg-surface-variant', 'text-on-surface-variant', 'cursor-not-allowed');
                continueBtn.classList.remove('bg-primary-container', 'text-on-primary', 'hover:bg-[#ff7a63]', 'cursor-pointer');
            }
        }
    </script>
