<!-- BottomNavBar is SUPPRESSED as this is a task-focused screen (Edit Profile) -->
<script>
        // Simple script to handle visual feedback on form focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary-container');
            });
        });
    </script>
